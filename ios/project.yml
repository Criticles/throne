# XcodeGen-спека: единственный источник истины для Xcode-проекта.
# Генерация: cd ios && xcodegen generate
#
# Два таргета:
#   Throne        — приложение (SwiftUI), создаёт VPN-профиль и управляет им.
#   PacketTunnel  — NEPacketTunnelProvider: запускает libbox и отдаёт ядру дескриптор utun.
#
# Libbox.xcframework собирается из форка throneproj/sing-box (см. core/singbox-ref.txt)
# и кладётся в ios/Frameworks/ — в git он не входит.

name: Throne

options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    # Версию и номер сборки подставляет CI: TestFlight требует уникальный CFBundleVersion
    # у каждой загрузки, поэтому он собирается из номера прогона.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM не задаём здесь: для неподписанной сборки он не нужен,
    # а для подписи CI передаёт его аргументом (см. .github/workflows/ios.yml).
    OTHER_LDFLAGS:
      - "$(inherited)"
      - "-lresolv"

targets:
  Throne:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: PacketTunnel
        embed: true
      - framework: Frameworks/Libbox.xcframework
        embed: false
      # Движок Turnable: транспорт для WireTurn-профилей (слушает 127.0.0.1:9000).
      - framework: Frameworks/TurnableCore.xcframework
        embed: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Throne
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Throne.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.criticles.throne
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.criticles.throne
        PRODUCT_NAME: Throne

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    dependencies:
      - framework: Frameworks/Libbox.xcframework
        embed: false
      # Новый libbox обращается к UIDevice (определение платформы), а расширение
      # не линкует UIKit само по себе: без этого arm64-линковка падала на _OBJC_CLASS_$_UIDevice.
      - sdk: UIKit.framework
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: Throne Tunnel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.criticles.throne
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.criticles.throne.tunnel
        PRODUCT_NAME: PacketTunnel
        # Xcode требует YES для любого таргета-расширения и всех библиотек, которые он линкует.
        APPLICATION_EXTENSION_API_ONLY: YES
