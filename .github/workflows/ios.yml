# Сборка iOS: ядро (gomobile) → XcodeGen → неподписанный .ipa → (опционально) подпись и TestFlight.
#
# Почему неподписанный: Network Extension требует entitlement, который подписывает только
# платная команда Apple. Неподписанный .ipa переподписывается на Windows (Sideloadly/AltStore)
# и, главное, доказывает, что весь iOS-код компилируется — собрать iOS на Windows нельзя.
#
# Если заданы секреты Apple (см. docs/apple-setup.md), та же сборка подписывается автоматически
# по App Store Connect API key и уезжает в TestFlight.

name: iOS

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Загрузить сборку в TestFlight"
        required: false
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

env:
  SINGBOX_REPO: https://github.com/throneproj/sing-box
  IOS_MIN: "15.0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # Единственный источник правды о ядре — core/singbox-ref.txt. Раньше значения дублировались
      # в env этого файла, и правка одного места ничего не меняла: CI собирал старое ядро.
      - name: Ядро из core/singbox-ref.txt
        run: |
          set -euo pipefail
          grep -v '^[[:space:]]*#' core/singbox-ref.txt | tr -d '' >> "$GITHUB_ENV"
          grep '^SINGBOX_REF=' core/singbox-ref.txt

      - name: Toolchain
        uses: actions/setup-go@v5
        with:
          # badlinkname в тегах sing-box ссылается на символы crypto/tls, которые есть в Go 1.26,
          # но удалены в 1.27 — поэтому версия закреплена, а не «stable».
          go-version: '1.26.x'
          cache: false

      - name: Xcode + XcodeGen
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          brew install xcodegen
          go version

      - name: Кэш ядра
        id: cache-core
        uses: actions/cache@v4
        with:
          path: ios/Frameworks/Libbox.xcframework
          # Ключ — хеш файла с закреплённым коммитом ядра, тегами и самого workflow:
          # в ключах actions/cache нельзя запятые, а теги сборки их содержат,
          # а флаги gomobile (например -ldflags с версией) меняют результат, поэтому их хеш тоже в ключе.
          key: libbox-ios-${{ hashFiles('core/singbox-ref.txt', '.github/workflows/ios.yml') }}

      - name: Клонировать ядро
        if: steps.cache-core.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .core
          cd .core
          git init -q sing-box
          git -C sing-box remote add origin "$SINGBOX_REPO"
          git -C sing-box fetch -q --depth 1 origin "$SINGBOX_REF"
          git -C sing-box checkout -q --detach FETCH_HEAD
          git -C sing-box log -1 --format='core %h %ad %s'

      - name: gomobile
        if: steps.cache-core.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: libbox → Libbox.xcframework
        if: steps.cache-core.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd .core/sing-box
          # Версию ядра вшиваем в constant.Version: без этого LibboxVersion() возвращает "unknown"
          # (именно это показало приложение на устройстве).
          CORE_VER="$(git rev-parse --short HEAD)"
          mkdir -p "$GITHUB_WORKSPACE/ios/Frameworks"
          gomobile init
          gomobile bind -v \
            -target ios,iossimulator \
            -o "$GITHUB_WORKSPACE/ios/Frameworks/Libbox.xcframework" \
            -libname=Libbox \
            -iosversion "${{ env.IOS_MIN }}" \
            -tags "${{ env.IOS_TAGS }}" \
            -ldflags "-s -w -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=dev-${CORE_VER}" \
            ./experimental/libbox

      - name: Проверить фреймворк
        run: |
          set -euo pipefail
          test -d ios/Frameworks/Libbox.xcframework
          ls ios/Frameworks/Libbox.xcframework

      - name: XcodeGen
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate
          ls

      - name: Сборка (неподписанная, устройство)
        id: build
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project Throne.xcodeproj \
            -scheme Throne \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1 || STATUS=$?
          STATUS=${STATUS:-0}
          grep -E "error:|Undefined symbols|referenced from|\*\* BUILD" build/xcodebuild.log | head -100 || true
          # Раньше здесь стоял только test -d: xcodebuild успевал создать .app до падения,
          # и упавшая сборка выглядела успешной.
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::xcodebuild failed with exit code $STATUS"
            exit "$STATUS"
          fi
          test -d "build/dd/Build/Products/Release-iphoneos/Throne.app"
          echo "DD=$PWD/build/dd" >> "$GITHUB_OUTPUT"

      - name: Заголовки Libbox (для точных имён API)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libbox-headers
          path: ios/Frameworks/Libbox.xcframework/**/Headers/*.h
          if-no-files-found: ignore

      - name: Упаковать неподписанный .ipa
        working-directory: ios
        run: |
          set -euo pipefail
          rm -rf build/Payload build/Throne-unsigned.ipa
          mkdir -p build/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/Throne.app build/Payload/
          (cd build && zip -qry Throne-unsigned.ipa Payload)
          ls -lh build/Throne-unsigned.ipa

      - name: Лог сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build/xcodebuild.log
          if-no-files-found: ignore

      - name: Артефакт .ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Throne-unsigned
          path: ios/build/Throne-unsigned.ipa

      # ---------- подпись и TestFlight: только если заданы секреты ----------
      - name: Есть ли секреты Apple
        id: sign
        run: |
          if [ -n "${{ secrets.APPLE_CERT_P12 }}" ] && [ -n "${{ secrets.ASC_KEY_ID }}" ]; then
            echo "enabled=1" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            echo "::notice::Секреты Apple не заданы — сборка останется неподписанной"
          fi

      - name: Импорт сертификата
        if: steps.sign.outputs.enabled == '1'
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/throne.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo -n "$CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Ключ App Store Connect
        if: steps.sign.outputs.enabled == '1'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo -n "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive (автоподпись по API key)
        if: steps.sign.outputs.enabled == '1'
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Throne.xcodeproj \
            -scheme Throne \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Throne.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            | tee build/archive.log

      - name: Export .ipa
        if: steps.sign.outputs.enabled == '1'
        working-directory: ios
        run: |
          set -euo pipefail
          cat > build/export.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Throne.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/export.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            | tee build/export.log
          ls -lh build/export

      - name: Подписанный артефакт
        if: steps.sign.outputs.enabled == '1'
        uses: actions/upload-artifact@v4
        with:
          name: Throne-signed
          path: ios/build/export/*.ipa

      - name: Загрузить в TestFlight
        if: steps.sign.outputs.enabled == '1' && inputs.upload_to_testflight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" ~/.appstoreconnect/private_keys/
          IPA=$(ls build/export/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
